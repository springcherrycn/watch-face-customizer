<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpringCherry Watch Face</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-container">
        <!-- 设置面板（默认隐藏，点击齿轮弹出） -->
        <div class="settings-panel" id="settingsPanel">
            <div class="panel-header">
                <h3>Watch Settings</h3>
                <button class="close-btn" id="closePanel">&times;</button>
            </div>

            <div class="setting-group">
                <label id="labelLang">Language</label>
                <button class="btn btn-full" id="langToggle">
                    <span>中文 / English</span>
                </button>
            </div>

            <div class="setting-group">
                <label id="labelRegion">Timezone</label>
                <select id="regionSelect">
                    <option value="-12">UTC-12:00</option>
                    <option value="-11">UTC-11:00</option>
                    <option value="-10">UTC-10:00 (HST)</option>
                    <option value="-9">UTC-09:00 (AKST)</option>
                    <option value="-8">UTC-08:00 (PST)</option>
                    <option value="-7">UTC-07:00 (MST)</option>
                    <option value="-6">UTC-06:00 (CST)</option>
                    <option value="-5">UTC-05:00 (EST)</option>
                    <option value="-4">UTC-04:00 (AST)</option>
                    <option value="0">UTC+00:00 (GMT)</option>
                    <option value="1">UTC+01:00 (CET)</option>
                    <option value="2">UTC+02:00 (EET)</option>
                    <option value="3">UTC+03:00 (MSK)</option>
                    <option value="4">UTC+04:00</option>
                    <option value="5">UTC+05:00</option>
                    <option value="6">UTC+06:00</option>
                    <option value="7">UTC+07:00</option>
                    <option value="8" selected>UTC+08:00 (Beijing)</option>
                    <option value="9">UTC+09:00 (Tokyo)</option>
                    <option value="10">UTC+10:00</option>
                    <option value="11">UTC+11:00</option>
                    <option value="12">UTC+12:00</option>
                </select>
            </div>

            <div class="setting-group">
                <label id="labelDial">Dial Color</label>
                <select id="dialStyleSelect">
                    <option value="#000000">Black (Default)</option>
                    <option value="#FFFFFF">White</option>
                    <option value="random">🎨 Random Color</option>
                </select>
            </div>

            <div class="setting-group">
                <label id="labelBg">Background Image</label>
                <div class="input-with-btn">
                    <input type="text" id="bgImageUrl" placeholder="Paste image URL...">
                    <button id="pasteBtn">Paste</button>
                </div>
                <p class="hint" id="bgHint">Tip: Upload to SM.MS or ImgBB, copy link and paste.</p>
            </div>

            <div class="setting-group">
                <label id="labelAbout">About</label>
                <div class="about-card">
                    <strong>SpringCherry</strong>
                    <small id="aboutText">A minimalist smartwatch face designed for customization.</small>
                    <small id="contactText">Contact: springcherry@example.com</small>
                </div>
            </div>

            <button class="btn btn-primary" id="saveSettings">Apply & Close</button>
        </div>

        <!-- 主表盘区域 -->
        <div class="main-display">
            <!-- 表盘（12个刻度，无数字） -->
            <div class="watch-face" id="watchFace">
                <div class="hand hour-hand"></div>
                <div class="hand minute-hand"></div>
                <div class="hand second-hand"></div>
                <div class="center-dot"></div>
            </div>

            <!-- 表盘外的设置按钮 -->
            <button class="settings-launcher" id="openSettings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"></path>
                </svg>
            </button>

            <div class="brand-logo">SpringCherry</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
