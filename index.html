<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartoon Watch Customizer</title>
    <link rel="stylesheet" href="style.css">
    <!-- 引入世界国家下拉框库 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/css/intlTelInput.css">
</head>
<body>
    <div class="container">
        <header>
            <button id="langToggle">English / 中文</button>
        </header>

        <!-- 表盘区域 -->
        <div id="watchContainer" class="watch-face black-theme">
            <!-- VIP上传预览区 -->
            <div id="vipImageContainer" class="hidden">
                <img id="uploadedImage" src="" alt="VIP Custom Background">
            </div>
            <div class="watch-inner">
                <div id="dialNumbers"></div>
                <div class="hand hour-hand"></div>
                <div class="hand minute-hand"></div>
                <div class="center-dot"></div>
            </div>
        </div>

        <!-- 控制面板 -->
        <div class="controls">
            <!-- 1. 刻度样式 -->
            <div class="control-group">
                <label id="labelDial">Dial Style:</label>
                <select id="dialStyle">
                    <option value="arabic">Arabic (1-12)</option>
                    <option value="roman">Roman (I-XII)</option>
                    <option value="blank">Blank (Traditional)</option>
                </select>
            </div>

            <!-- 2. 颜色主题 -->
            <div class="control-group">
                <label id="labelColor">Theme:</label>
                <select id="colorTheme">
                    <option value="black">Black</option>
                    <option value="white">White</option>
                </select>
            </div>

            <!-- 3. 地区选择 -->
            <div class="control-group">
                <label id="labelRegion">Region:</label>
                <input type="text" id="countrySelect" placeholder="Select country">
            </div>

            <!-- 4. VIP上传 (低成本解决方案) -->
            <div class="control-group vip-section">
                <label id="labelVip">VIP Custom Background:</label>
                <p class="vip-tip" id="vipTip">Upload your image below. Then send a screenshot of this page to the merchant for final production.</p>
                <input type="file" id="imageUpload" accept="image/*">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/js/intlTelInput.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
