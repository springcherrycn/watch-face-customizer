<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpringCherry Watch</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="page-container">
        <div class="main-display">
            <!-- 表盘（JS动态生成12刻度，100%可见） -->
            <div class="watch-face theme-dark" id="watchFace">
                <!-- 12个刻度由JS动态生成，无需手写 -->
                <div class="hand hour-hand"></div>
                <div class="hand minute-hand"></div>
                <div class="hand second-hand"></div>
                <div class="center-dot"></div>
            </div>

            <!-- Settings齿轮按钮（点击开关菜单，无X按钮） -->
            <button class="settings-launcher" id="openSettings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"></path>
                </svg>
            </button>

            <!-- 半透明下拉菜单（无X按钮、无Apply&Close按钮） -->
            <div class="settings-panel" id="settingsPanel">
                <!-- Watch Settings标题，随语言切换 -->
                <div class="panel-header">
                    <h3 id="panelTitle">Watch Settings</h3>
                </div>

                <div class="setting-group">
                    <!-- 语言改为「语言设置」 -->
                    <label id="labelLang">Language Settings</label>
                    <select id="langSelect">
                        <option value="en" selected>English</option>
                        <option value="zh-CN">中文简体</option>
                        <option value="zh-TW">繁體中文</option>
                    </select>
                </div>

                <div class="setting-group">
                    <label id="labelRegion">Timezone</label>
                    <select id="regionSelect">
                        <option value="8" selected>UTC+08:00 (Beijing)</option>
                        <option value="0">UTC+00:00 (London)</option>
                        <option value="9">UTC+09:00 (Tokyo)</option>
                        <option value="-5">UTC-05:00 (New York)</option>
                        <option value="1">UTC+01:00 (Paris)</option>
                        <option value="3">UTC+03:00 (Moscow)</option>
                        <option value="10">UTC+10:00 (Sydney)</option>
                        <option value="-8">UTC-08:00 (Los Angeles)</option>
                    </select>
                </div>

                <div class="setting-group">
                    <label id="labelDial">Dial Color</label>
                    <select id="dialStyleSelect">
                        <option value="#000000">Black (Default)</option>
                        <option value="#FFFFFF">White</option>
                        <option value="random">🎨 Random Color</option>
                    </select>
                </div>

                <div class="setting-group">
                    <label id="labelBg">Background Image</label>
                    <div class="input-with-btn">
                        <input type="text" id="bgImageUrl" placeholder="Paste image link...">
                        <button id="pasteBtn">Paste</button>
                    </div>
                    <p class="hint" id="bgHint">Upload to SM.MS/ImgBB, copy link and click Paste</p>
                </div>

                <div class="setting-group">
                    <label id="labelAbout">About</label>
                    <div class="about-card">
                        <!-- 文案已修正：依法享有全部知识产权 + 联系我们 -->
                        <small id="aboutText">A minimalist creative watch face designed by SpringCherry, a music merchandise brand from Mainland China. SpringCherry legally reserves all intellectual property rights. Contact: springcherry@126.com</small>
                    </div>
                </div>
                <!-- 已删除Apply&Close按钮 -->
            </div>

            <!-- 底部品牌文字 -->
            <div class="brand-logo">SpringCherry™</div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
